<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RO 公會管理系統 - 測試版</title>
    
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cellipse cx='50' cy='60' rx='40' ry='35' fill='%23ff99aa'/%3E%3Cellipse cx='50' cy='58' rx='38' ry='32' fill='%23ffb3bf'/%3E%3Cpath d='M35 55 Q 35 45 40 45 T 45 55' fill='none' stroke='%23333' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M55 55 Q 55 45 60 45 T 65 55' fill='none' stroke='%23333' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background: #f8fafc; color: #1e293b; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.5); }
        .loading-overlay { position: fixed; inset: 0; background: #ffffff; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .room-tag { font-family: monospace; letter-spacing: 1px; }
        .btn-primary { @apply bg-blue-600 text-white hover:bg-blue-700 transition-all shadow-md active:scale-95; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div id="app_loading" class="loading-overlay">
        <div class="animate-spin rounded-full h-12 w-12 border-4 border-blue-100 border-t-blue-600 mb-4"></div>
        <p class="text-blue-900 font-bold">讀取資料中...</p>
    </div>

    <!-- 1. 登入介面 -->
    <div id="auth_screen" class="hidden fixed inset-0 z-[100] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md p-8 rounded-3xl shadow-2xl">
            <div class="text-center mb-8">
                <div class="text-5xl mb-4">🐷</div>
                <h1 class="text-2xl font-black text-slate-800">冒險者登入</h1>
                <p class="text-slate-400 mt-2 text-sm">請登入以建立與管理您的分組看板</p>
            </div>
            <div class="space-y-4">
                <input type="email" id="auth_email" placeholder="電子郵件 (Email)" class="w-full px-4 py-3 bg-slate-50 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500 transition">
                <input type="password" id="auth_password" placeholder="密碼 (Password)" class="w-full px-4 py-3 bg-slate-50 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500 transition">
                <button id="auth_btn" class="w-full py-4 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 shadow-lg transition">登入 / 註冊</button>
                
                <div class="flex items-center gap-4 py-2">
                    <div class="flex-1 h-[1px] bg-slate-100"></div>
                    <span class="text-slate-300 text-xs">快速測試</span>
                    <div class="flex-1 h-[1px] bg-slate-100"></div>
                </div>
                
                <button id="test_acc_btn" class="w-full py-3 border-2 border-blue-100 text-blue-600 rounded-xl font-bold hover:bg-blue-50 transition">
                    使用測試帳號登入
                </button>
                
                <button id="guest_btn" class="w-full text-slate-400 text-sm hover:underline">匿名進入 (僅限協作觀看)</button>
            </div>
        </div>
    </div>

    <!-- 2. 大廳介面 -->
    <div id="lobby_screen" class="hidden fixed inset-0 z-[90] bg-slate-50 flex items-center justify-center p-4 overflow-y-auto">
        <div class="max-w-2xl w-full my-auto">
            <div class="flex justify-between items-center mb-8">
                <div>
                    <h2 class="text-3xl font-black text-slate-800">公會大廳</h2>
                    <p id="user_display" class="text-slate-400 text-sm"></p>
                </div>
                <button onclick="handleLogout()" class="px-4 py-2 bg-white text-red-400 rounded-xl text-sm font-bold shadow-sm border border-red-50 hover:bg-red-50">登出</button>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                <button onclick="createNewBoard()" class="p-8 bg-blue-600 text-white rounded-3xl shadow-xl hover:bg-blue-700 transition flex flex-col items-center gap-3 active:scale-95">
                    <span class="text-4xl">➕</span>
                    <span class="font-black text-lg">建立新分組看板</span>
                </button>
                <div class="p-8 bg-white border-2 border-dashed border-slate-200 rounded-3xl flex flex-col items-center gap-3">
                    <span class="text-4xl">🔑</span>
                    <div class="flex w-full gap-2">
                        <input type="text" id="join_code_input" placeholder="輸入協作代碼" class="flex-1 text-center bg-slate-100 border-0 rounded-xl text-sm uppercase font-bold p-2">
                        <button onclick="joinBoardByCode()" class="px-6 py-2 bg-slate-800 text-white rounded-xl text-sm font-bold">加入</button>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100">
                <h3 class="text-xs font-black text-slate-400 mb-6 uppercase tracking-[0.2em]">我的冒險日誌 (最近看板)</h3>
                <div id="my_boards_list" class="space-y-3">
                    <div class="text-center py-10">
                        <div class="animate-pulse text-slate-200 text-4xl mb-2">📋</div>
                        <p class="text-slate-300 text-sm">正在載入看板列表...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 3. 主程式介面 -->
    <div id="main_app" class="max-w-6xl mx-auto hidden pb-20">
        <header class="mb-10 flex flex-col md:flex-row justify-between items-start md:items-end gap-6">
            <div class="w-full md:w-auto">
                <div class="flex flex-wrap items-center gap-2 mb-3">
                    <button onclick="returnToLobby()" class="bg-slate-800 text-white px-3 py-1 rounded-lg text-xs font-bold hover:bg-black transition">← 返回大廳</button>
                    <div class="bg-blue-100 text-blue-600 px-3 py-1 rounded-lg text-xs font-black flex items-center gap-2">
                        代碼: <span id="display_room_id" class="room-tag">---</span>
                        <button onclick="copyRoomCode()" class="text-blue-400 hover:text-blue-700">📋</button>
                    </div>
                </div>
                <div class="group relative">
                    <input type="text" id="app_title" class="text-4xl font-black text-slate-800 bg-transparent border-b-2 border-transparent focus:border-blue-500 outline-none w-full pr-10 transition-all">
                    <span class="absolute right-0 top-1/2 -translate-y-1/2 opacity-0 group-hover:opacity-30 text-xs">✏️</span>
                </div>
            </div>
            <div class="flex gap-3 w-full md:w-auto">
                <button onclick="toggleModal('addMemberModal', true)" class="flex-1 md:flex-none bg-blue-600 text-white px-8 py-3 rounded-2xl font-black shadow-lg shadow-blue-200 hover:bg-blue-700 transition-all">新增成員</button>
                <button onclick="toggleModal('allMembersModal', true)" class="p-3 bg-white border rounded-2xl shadow-sm hover:bg-slate-50">📋</button>
                <button onclick="toggleModal('statsModal', true)" class="p-3 bg-white border rounded-2xl shadow-sm hover:bg-slate-50">📊</button>
            </div>
        </header>

        <div class="space-y-8">
            <section class="glass-card rounded-3xl overflow-hidden shadow-sm border border-slate-200">
                <div class="px-6 py-4 bg-slate-800 flex justify-between items-center cursor-pointer select-none" onclick="toggleUnassigned()">
                    <h2 class="text-white font-black flex items-center gap-3">
                        <span class="bg-white/20 w-8 h-8 rounded-lg flex items-center justify-center text-sm">🎒</span>
                        待分配成員 (<span id="unassigned_count">0</span>)
                    </h2>
                    <span id="collapse_icon" class="text-white/40 text-xs transition-transform">▼</span>
                </div>
                <div id="unassigned_content" class="p-6 transition-all">
                    <div id="unassigned_list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4"></div>
                </div>
            </section>

            <section class="space-y-6">
                <div class="flex items-center justify-between border-b border-slate-200 pb-3">
                    <h3 class="text-xl font-black text-slate-800 flex items-center gap-2">
                        <span class="text-blue-500">⚔️</span> 戰略分組
                    </h3>
                    <button onclick="addGroup()" class="bg-white px-4 py-1.5 rounded-xl text-sm font-bold text-blue-600 border border-blue-100 hover:bg-blue-50 transition shadow-sm">+ 建立小組</button>
                </div>
                <div id="groups_container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            </section>
        </div>
    </div>

    <!-- Modals (Add, Stats, List) -->
    <div id="addMemberModal" class="hidden fixed inset-0 z-[110] flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm">
        <div class="bg-white w-full max-w-md rounded-3xl p-8 shadow-2xl">
            <h2 class="text-xl font-black mb-6 flex items-center gap-2">✨ 招募新成員</h2>
            <div class="space-y-5">
                <div>
                    <label class="text-xs font-bold text-slate-400 mb-2 block uppercase">角色暱稱</label>
                    <input type="text" id="member_name" class="w-full px-4 py-3 bg-slate-50 border border-slate-100 rounded-xl outline-none focus:ring-2 focus:ring-blue-500" placeholder="輸入名稱...">
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-400 mb-2 block uppercase">職業</label>
                    <select id="member_job" class="w-full px-4 py-3 bg-slate-50 border border-slate-100 rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
                        <option value="牧師">✨ 牧師 (Priest)</option>
                        <option value="獵人">🏹 獵人 (Hunter)</option>
                        <option value="鐵匠">🔨 鐵匠 (Blacksmith)</option>
                        <option value="巫師">🔮 巫師 (Wizard)</option>
                        <option value="刺客">🗡️ 刺客 (Assassin)</option>
                        <option value="騎士">🛡️ 騎士 (Knight)</option>
                        <option value="槍手">🔫 槍手 (Gunslinger)</option>
                    </select>
                </div>
                <div class="flex gap-3 pt-4">
                    <button onclick="toggleModal('addMemberModal', false)" class="flex-1 py-3 bg-slate-100 text-slate-600 rounded-xl font-bold hover:bg-slate-200 transition">取消</button>
                    <button onclick="addMember()" class="flex-1 py-3 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 shadow-lg shadow-blue-100 transition">確認加入</button>
                </div>
            </div>
        </div>
    </div>

    <div id="allMembersModal" class="hidden fixed inset-0 z-[110] flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm">
        <div class="bg-white w-full max-w-2xl rounded-3xl p-8 max-h-[85vh] flex flex-col shadow-2xl">
            <h2 class="text-xl font-black mb-6">冒險者名錄 (<span id="modal_total_count">0</span>)</h2>
            <div class="overflow-y-auto flex-grow border border-slate-100 rounded-2xl">
                <table class="w-full text-left text-sm">
                    <thead class="bg-slate-50 sticky top-0">
                        <tr>
                            <th class="p-4 font-black text-slate-400 uppercase text-[10px]">成員名稱</th>
                            <th class="p-4 font-black text-slate-400 uppercase text-[10px]">職業</th>
                            <th class="p-4 font-black text-slate-400 uppercase text-[10px]">當前組別</th>
                        </tr>
                    </thead>
                    <tbody id="all_members_table_body" class="divide-y divide-slate-50"></tbody>
                </table>
            </div>
            <button onclick="toggleModal('allMembersModal', false)" class="mt-6 py-4 bg-slate-900 text-white rounded-2xl font-bold hover:bg-black transition">返回看板</button>
        </div>
    </div>

    <div id="statsModal" class="hidden fixed inset-0 z-[110] flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm">
        <div class="bg-white w-full max-w-md rounded-3xl p-8 shadow-2xl">
            <h2 class="text-xl font-black mb-8 flex items-center gap-2">📊 職業分布統計</h2>
            <div id="stats_container" class="space-y-6"></div>
            <button onclick="toggleModal('statsModal', false)" class="w-full mt-10 py-4 bg-slate-900 text-white rounded-2xl font-bold">關閉</button>
        </div>
    </div>

    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-8 py-3 rounded-2xl opacity-0 transition-all z-[120] text-sm font-bold pointer-events-none shadow-2xl"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, addDoc, updateDoc, deleteDoc, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
    "apiKey": "AIzaSyBwOa814rtGLjhtt4gum_vwWlYzQDTXehU",
    "authDomain": "loseweight-4b745.firebaseapp.com",
    "projectId": "loseweight-4b745",
    "storageBucket": "loseweight-4b745.firebasestorage.app",
    "messagingSenderId": "76431868318",
    "appId": "1:76431868318:web:d5fdb15284f2823cf8d68f",
    "measurementId": "G-LVBCZP0LK2"
};
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'ro-guild-pro';

        let user = null;
        let activeRoom = null;
        let members = [];
        let groups = [];
        let unsubscribes = [];

        const jobsConfig = {
            "牧師": { icon: "✨", color: "#0ea5e9", border: "border-l-blue-500", bg: "bg-blue-50" },
            "獵人": { icon: "🏹", color: "#22c55e", border: "border-l-green-500", bg: "bg-green-50" },
            "鐵匠": { icon: "🔨", color: "#eab308", border: "border-l-yellow-500", bg: "bg-yellow-50" },
            "巫師": { icon: "🔮", color: "#a855f7", border: "border-l-purple-500", bg: "bg-purple-50" },
            "刺客": { icon: "🗡️", color: "#64748b", border: "border-l-slate-500", bg: "bg-slate-50" },
            "騎士": { icon: "🛡️", color: "#ef4444", border: "border-l-red-500", bg: "bg-red-50" },
            "槍手": { icon: "🔫", color: "#f97316", border: "border-l-orange-500", bg: "bg-orange-50" }
        };

        // --- Auth & Startup ---
        onAuthStateChanged(auth, (u) => {
            user = u;
            document.getElementById('app_loading').classList.add('hidden');
            if (u) {
                document.getElementById('auth_screen').classList.add('hidden');
                document.getElementById('lobby_screen').classList.remove('hidden');
                document.getElementById('user_display').innerText = u.isAnonymous ? "訪客身份協作中" : u.email;
                loadMyBoards();
            } else {
                document.getElementById('auth_screen').classList.remove('hidden');
                document.getElementById('lobby_screen').classList.add('hidden');
                document.getElementById('main_app').classList.add('hidden');
            }
        });

        const handleAuth = async () => {
            const email = document.getElementById('auth_email').value.trim();
            const pass = document.getElementById('auth_password').value;
            if (!email || !pass) return showToast("請填寫帳號密碼");
            
            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (e) {
                try {
                    await createUserWithEmailAndPassword(auth, email, pass);
                    showToast("帳號建立並登入成功！");
                } catch (e2) { showToast("密碼錯誤或信箱格式無效"); }
            }
        };

        document.getElementById('auth_btn').onclick = handleAuth;
        document.getElementById('guest_btn').onclick = () => signInAnonymously(auth);
        
        // 測試帳號快速登入功能
        document.getElementById('test_acc_btn').onclick = () => {
            document.getElementById('auth_email').value = "tester@ro-guild.com";
            document.getElementById('auth_password').value = "ro123456";
            handleAuth();
        };

        window.handleLogout = () => {
            signOut(auth);
            localStorage.removeItem('last_ro_room');
        };

        // --- Lobby Logic ---
        window.createNewBoard = async () => {
            if (!user || user.isAnonymous) return showToast("請登入帳號後再建立看板");
            
            document.getElementById('app_loading').classList.remove('hidden');
            const roomId = 'RO-' + Math.random().toString(36).substr(2, 6).toUpperCase();
            
            try {
                // 1. 公共數據空間
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', roomId), {
                    title: "我的冒險分組",
                    owner: user.uid,
                    createdAt: Date.now()
                });

                // 2. 使用者私有名單
                await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'my_boards', roomId), {
                    roomId,
                    title: "我的冒險分組",
                    createdAt: Date.now()
                });

                openBoard(roomId);
            } catch (err) {
                showToast("建立失敗，請重試");
                document.getElementById('app_loading').classList.add('hidden');
            }
        };

        window.joinBoardByCode = () => {
            const code = document.getElementById('join_code_input').value.trim().toUpperCase();
            if (!code) return showToast("請輸入代碼");
            openBoard(code);
        };

        function loadMyBoards() {
            if (!user || user.isAnonymous) {
                document.getElementById('my_boards_list').innerHTML = '<p class="text-center text-slate-300 py-6 text-sm italic">訪客無法保存看板，請建立代碼與好友協作</p>';
                return;
            }
            
            const q = collection(db, 'artifacts', appId, 'users', user.uid, 'my_boards');
            onSnapshot(q, (s) => {
                const list = document.getElementById('my_boards_list');
                const boards = s.docs.map(d => d.data());
                if (boards.length === 0) {
                    list.innerHTML = '<div class="text-center py-8 text-slate-300 text-sm">目前尚無任何看板<br>點擊上方按鈕建立一個吧！</div>';
                    return;
                }
                list.innerHTML = boards.sort((a,b) => b.createdAt - a.createdAt).map(b => `
                    <div onclick="openBoard('${b.roomId}')" class="group p-4 bg-slate-50 hover:bg-blue-50 border border-transparent hover:border-blue-100 rounded-2xl cursor-pointer flex justify-between items-center transition-all">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 bg-white rounded-xl flex items-center justify-center shadow-sm group-hover:shadow-blue-100 transition">📝</div>
                            <div>
                                <p class="font-bold text-slate-700 group-hover:text-blue-600 transition">${b.title}</p>
                                <p class="text-[10px] text-slate-400 room-tag">${b.roomId}</p>
                            </div>
                        </div>
                        <span class="text-slate-300 group-hover:translate-x-1 transition-transform">→</span>
                    </div>
                `).join('');
            });
        }

        // --- Board View Logic ---
        async function openBoard(roomId) {
            document.getElementById('app_loading').classList.remove('hidden');
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', roomId);
            const snap = await getDoc(roomRef);
            
            if (!snap.exists()) {
                document.getElementById('app_loading').classList.add('hidden');
                return showToast("代碼錯誤或看板已刪除");
            }

            activeRoom = roomId;
            localStorage.setItem('last_ro_room', roomId);
            document.getElementById('lobby_screen').classList.add('hidden');
            document.getElementById('main_app').classList.remove('hidden');
            document.getElementById('display_room_id').innerText = roomId;
            
            // 清理舊監聽器
            unsubscribes.forEach(un => un());
            unsubscribes = [];

            const mColl = collection(db, 'artifacts', appId, 'public', 'data', roomId, 'members');
            const gColl = collection(db, 'artifacts', appId, 'public', 'data', roomId, 'groups');

            unsubscribes.push(onSnapshot(roomRef, (s) => {
                if(s.exists()) document.getElementById('app_title').value = s.data().title;
            }));

            unsubscribes.push(onSnapshot(mColl, (s) => {
                members = s.docs.map(d => ({ id: d.id, ...d.data() }));
                renderUI();
                document.getElementById('app_loading').classList.add('hidden');
            }));

            unsubscribes.push(onSnapshot(gColl, (s) => {
                groups = s.docs.map(d => ({ id: d.id, ...d.data() }));
                renderUI();
            }));
        }

        window.returnToLobby = () => {
            activeRoom = null;
            document.getElementById('main_app').classList.add('hidden');
            document.getElementById('lobby_screen').classList.remove('hidden');
            unsubscribes.forEach(un => un());
        };

        // --- Database Operations ---
        const rPath = (c) => collection(db, 'artifacts', appId, 'public', 'data', activeRoom, c);
        const rDoc = (c, id) => doc(db, 'artifacts', appId, 'public', 'data', activeRoom, c, id);

        window.addMember = async () => {
            const name = document.getElementById('member_name').value.trim();
            const job = document.getElementById('member_job').value;
            if (!name) return showToast("請輸入暱稱");
            await addDoc(rPath('members'), { name, job, groupId: null, createdAt: Date.now() });
            document.getElementById('member_name').value = '';
            toggleModal('addMemberModal', false);
        };

        window.addGroup = async () => {
            const nextId = groups.length > 0 ? Math.max(...groups.map(g => parseInt(g.id))) + 1 : 1;
            await setDoc(rDoc('groups', nextId.toString()), { id: nextId, name: `第 ${nextId} 小組`, limit: 5 });
        };

        window.assignToGroup = async (mId, gId) => {
            if (gId !== null) {
                const group = groups.find(g => g.id == gId);
                const limit = group?.limit || 5;
                if (members.filter(m => m.groupId == gId).length >= limit) return showToast(`該組成員已達 ${limit} 人上限`);
            }
            await updateDoc(rDoc('members', mId), { groupId: gId });
        };

        window.updateGroupLimit = async (gId, limit) => {
            await updateDoc(rDoc('groups', gId.toString()), { limit: parseInt(limit) || 5 });
        };

        window.deleteMember = async (id) => {
            if(confirm("確定移除該成員？")) await deleteDoc(rDoc('members', id));
        };

        // --- Rendering ---
        function renderUI() {
            document.getElementById('modal_total_count').innerText = members.length;
            const unassigned = members.filter(m => m.groupId === null);
            document.getElementById('unassigned_count').innerText = unassigned.length;

            const unList = document.getElementById('unassigned_list');
            unList.innerHTML = unassigned.map(m => `
                <div class="bg-white p-5 rounded-2xl shadow-sm border-l-4 ${jobsConfig[m.job].border} hover:shadow-md transition-shadow">
                    <div class="font-black text-slate-700 mb-4 flex items-center gap-2">
                        <span class="text-xl">${jobsConfig[m.job].icon}</span>
                        <span>${m.name}</span>
                    </div>
                    <div class="flex gap-2">
                        <select onchange="assignToGroup('${m.id}', this.value ? parseInt(this.value) : null)" class="flex-1 text-[11px] bg-slate-50 border-0 rounded-lg p-2 font-bold focus:ring-1 focus:ring-blue-400">
                            <option value="">選擇分組...</option>
                            ${groups.map(g => `<option value="${g.id}">${g.name}</option>`).join('')}
                        </select>
                        <button onclick="deleteMember('${m.id}')" class="px-2 text-slate-300 hover:text-red-400">🗑️</button>
                    </div>
                </div>
            `).join('') || '<p class="col-span-full text-center text-slate-300 py-6 text-sm">所有成員皆已分配</p>';

            const gCont = document.getElementById('groups_container');
            gCont.innerHTML = groups.sort((a,b) => a.id - b.id).map(g => {
                const gm = members.filter(m => m.groupId == g.id);
                const isFull = gm.length >= (g.limit || 5);
                return `
                <div class="glass-card p-6 rounded-3xl flex flex-col border-t-4 ${isFull ? 'border-t-red-400' : 'border-t-blue-500'} shadow-sm">
                    <div class="flex justify-between items-center mb-6">
                        <span class="font-black text-slate-800">${g.name}</span>
                        <div class="flex items-center gap-1.5 bg-slate-100 px-3 py-1.5 rounded-xl text-xs">
                            <span class="${isFull ? 'text-red-500' : 'text-blue-600'} font-black text-sm">${gm.length}</span>
                            <span class="text-slate-300">/</span>
                            <input type="number" value="${g.limit || 5}" onchange="updateGroupLimit(${g.id}, this.value)" class="w-6 text-center bg-transparent font-black outline-none">
                        </div>
                    </div>
                    <div class="space-y-3">
                        ${gm.map(m => `
                            <div onclick="assignToGroup('${m.id}', null)" class="group p-3 ${jobsConfig[m.job].bg} rounded-xl text-xs font-bold flex justify-between items-center hover:bg-red-50 cursor-pointer transition-colors">
                                <span class="text-slate-700">${jobsConfig[m.job].icon} ${m.name}</span>
                                <span class="text-[9px] text-red-300 opacity-0 group-hover:opacity-100 transition-opacity">點擊移出</span>
                            </div>
                        `).join('') || '<div class="text-center text-[10px] text-slate-300 py-10 border-2 border-dashed border-slate-100 rounded-2xl">待隊友加入</div>'}
                    </div>
                </div>`;
            }).join('');
        }

        window.toggleModal = (id, show) => {
            document.getElementById(id).classList.toggle('hidden', !show);
            if(show && id === 'statsModal') updateStats();
            if(show && id === 'allMembersModal') renderAllTable();
        };

        function renderAllTable() {
            document.getElementById('all_members_table_body').innerHTML = members.map(m => `
                <tr class="hover:bg-slate-50 transition-colors">
                    <td class="p-4 font-black text-slate-700">${m.name}</td>
                    <td class="p-4"><span class="px-3 py-1 rounded-lg text-xs font-bold ${jobsConfig[m.job].bg}" style="color:${jobsConfig[m.job].color}">${m.job}</span></td>
                    <td class="p-4 text-blue-600 font-black">${m.groupId ? '第 '+m.groupId+' 小組' : '-'}</td>
                </tr>
            `).join('');
        }

        function updateStats() {
            const cont = document.getElementById('stats_container');
            cont.innerHTML = Object.keys(jobsConfig).map(job => {
                const count = members.filter(m => m.job === job).length;
                const perc = members.length ? (count / members.length * 100).toFixed(1) : 0;
                return `
                    <div>
                        <div class="flex justify-between items-end mb-2">
                            <span class="font-black text-slate-700">${jobsConfig[job].icon} ${job}</span>
                            <span class="font-black text-blue-600 text-lg">${count} <span class="text-[10px] text-slate-300 font-normal">(${perc}%)</span></span>
                        </div>
                        <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                            <div style="width:${perc}%; background:${jobsConfig[job].color}" class="h-full transition-all duration-1000"></div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.copyRoomCode = () => {
            const el = document.createElement('textarea');
            el.value = activeRoom;
            document.body.appendChild(el); el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            showToast("代碼 " + activeRoom + " 已複製！可傳給好友共同編輯");
        };

        window.showToast = (msg) => {
            const t = document.getElementById('toast');
            t.innerText = msg; t.classList.replace('opacity-0', 'opacity-100');
            setTimeout(() => t.classList.replace('opacity-100', 'opacity-0'), 2500);
        };

        document.getElementById('app_title').onblur = async () => {
            if (!activeRoom) return;
            const title = document.getElementById('app_title').value;
            await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', activeRoom), { title });
            if (user && !user.isAnonymous) {
                await updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'my_boards', activeRoom), { title });
            }
        };

        window.toggleUnassigned = () => {
            const content = document.getElementById('unassigned_content');
            const icon = document.getElementById('collapse_icon');
            content.classList.toggle('hidden');
            icon.style.transform = content.classList.contains('hidden') ? 'rotate(-90deg)' : 'rotate(0deg)';
        };
    </script>
</body>
</html>
