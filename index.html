<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RO 公會成員手動分組系統 - 雲端版</title>

    <!-- PWA & Icon 設定 -->
    <meta name="theme-color" content="#f0f4f8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="RO公會管理">

    <!-- 使用 SVG 繪製可愛波利圖示 -->
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cellipse cx='50' cy='60' rx='40' ry='35' fill='%23ff99aa'/%3E%3Cellipse cx='50' cy='58' rx='38' ry='32' fill='%23ffb3bf'/%3E%3Cpath d='M35 55 Q 35 45 40 45 T 45 55' fill='none' stroke='%23333' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M55 55 Q 55 45 60 45 T 65 55' fill='none' stroke='%23333' stroke-width='3' stroke-linecap='round'/%3E%3Cellipse cx='35' cy='65' rx='5' ry='3' fill='%23ffccd5'/%3E%3Cellipse cx='65' cy='65' rx='5' ry='3' fill='%23ffccd5'/%3E%3C/svg%3E">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #f0f4f8 0%, #d7e3ec 100%);
            min-height: 100vh;
            color: #1e293b;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .member-item {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border-left: 4px solid transparent;
        }

        .member-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.08);
        }

        .border-牧師 {
            border-left-color: #0ea5e9;
        }

        .border-獵人 {
            border-left-color: #22c55e;
        }

        .border-鐵匠 {
            border-left-color: #eab308;
        }

        .border-巫師 {
            border-left-color: #a855f7;
        }

        .border-刺客 {
            border-left-color: #64748b;
        }

        .border-騎士 {
            border-left-color: #ef4444;
        }

        .border-槍手 {
            border-left-color: #f97316;
        }

        .loading-overlay {
            position: fixed;
            inset: 0;
            background: #ffffff;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .group-card {
            transition: transform 0.2s ease;
        }

        .group-card:hover {
            transform: translateY(-4px);
        }

        th.sortable {
            cursor: pointer;
            user-select: none;
            position: relative;
        }

        th.sortable:hover {
            background-color: #f8fafc;
        }

        th.sortable::after {
            content: '↕';
            position: absolute;
            right: 8px;
            opacity: 0.2;
        }

        th.asc::after {
            content: '↑';
            opacity: 1;
            color: #2563eb;
        }

        th.desc::after {
            content: '↓';
            opacity: 1;
            color: #2563eb;
        }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .limit-input:focus {
            background: rgba(59, 130, 246, 0.1);
        }
    </style>
</head>

<body class="p-4 md:p-8">
    <div id="app_loading" class="loading-overlay">
        <div class="animate-spin rounded-full h-12 w-12 border-4 border-blue-100 border-t-blue-600 mb-4"></div>
        <p class="text-blue-900 font-bold tracking-widest">連線至公會伺服器...</p>
    </div>

    <!-- 登入界面 -->
    <div id="auth_screen"
        class="hidden fixed inset-0 z-[100] bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md p-8 rounded-3xl shadow-2xl relative">
            <div class="text-center mb-8">
                <div class="inline-block p-4 bg-blue-50 rounded-full mb-4">
                    <svg width="60" height="60" viewBox="0 0 100 100">
                        <ellipse cx="50" cy="60" rx="40" ry="35" fill="#ff99aa" />
                        <ellipse cx="50" cy="58" rx="38" ry="32" fill="#ffb3bf" />
                        <path d="M35 55 Q 35 45 40 45 T 45 55" fill="none" stroke="#333" stroke-width="3"
                            stroke-linecap="round" />
                        <path d="M55 55 Q 55 45 60 45 T 65 55" fill="none" stroke="#333" stroke-width="3"
                            stroke-linecap="round" />
                    </svg>
                </div>
                <h1 class="text-2xl font-black text-slate-800 tracking-tight">RO 公會管理系統</h1>
                <p class="text-slate-400 mt-2 text-sm" id="auth_subtitle">冒險者，請先登入或選擇遊客模式</p>
            </div>
            <div class="space-y-4">
                <div id="email_fields" class="space-y-3">
                    <input type="email" id="auth_email" placeholder="電子郵件"
                        class="w-full px-4 py-3 bg-slate-50 border border-slate-100 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition">
                    <input type="password" id="auth_password" placeholder="密碼"
                        class="w-full px-4 py-3 bg-slate-50 border border-slate-100 rounded-xl focus:ring-2 focus:ring-blue-500 transition outline-none">
                    <button id="auth_submit_btn"
                        class="w-full py-4 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 transition shadow-lg shadow-blue-200">登入系統</button>
                    <button id="auth_switch_btn" class="w-full text-blue-500 text-sm font-bold">還沒有帳號？點此註冊</button>
                </div>
                <div class="flex items-center gap-4 py-2">
                    <div class="flex-1 h-[1px] bg-slate-100"></div>
                    <span class="text-slate-300 text-xs">OR</span>
                    <div class="flex-1 h-[1px] bg-slate-100"></div>
                </div>
                <button id="guest_login_btn"
                    class="w-full py-4 bg-slate-800 text-white rounded-xl font-bold hover:bg-black transition flex items-center justify-center gap-2">
                    👤 遊客快速試用
                </button>
            </div>
        </div>
    </div>

    <!-- 主程式 -->
    <div id="main_app" class="max-w-6xl mx-auto hidden">
        <header class="mb-10 flex flex-col md:flex-row justify-between items-end gap-6">
            <div class="w-full md:w-auto">
                <div class="flex items-center gap-2 mb-1">
                    <span id="login_type_tag" class="text-[10px] font-black px-2 py-0.5 rounded uppercase"></span>
                    <span class="text-[10px] bg-indigo-500 text-white px-2 py-0.5 rounded font-black uppercase">總人數:
                        <span id="total_member_count">0</span></span>
                </div>
                <div class="flex items-center gap-3">
                    <input type="text" id="app_title"
                        class="text-4xl font-black text-slate-800 bg-transparent border-b-2 border-transparent hover:border-blue-300 focus:border-blue-500 outline-none transition w-full md:w-auto">
                </div>
                <div class="flex items-center gap-2 mt-2 text-slate-500 text-sm font-medium">
                    <span id="user_display_info"></span>
                    <button onclick="handleLogout()"
                        class="text-red-400 hover:text-red-600 transition ml-2">登出系統</button>
                </div>
            </div>

            <div class="flex flex-wrap gap-3 w-full md:w-auto items-center">
                <button onclick="toggleModal('addMemberModal', true)"
                    class="flex-1 md:flex-none bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-bold shadow-xl shadow-blue-100 transition-all flex items-center justify-center gap-2">
                    <span>+</span> 新增成員
                </button>
                <button onclick="toggleModal('allMembersModal', true)"
                    class="p-3 bg-white text-slate-700 rounded-xl shadow-sm hover:bg-slate-50 border border-slate-200 transition"
                    title="所有名單">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect width="7" height="7" x="3" y="3" rx="1" />
                        <rect width="7" height="7" x="14" y="3" rx="1" />
                        <rect width="7" height="7" x="14" y="14" rx="1" />
                        <rect width="7" height="7" x="3" y="14" rx="1" />
                    </svg>
                </button>
                <button onclick="toggleModal('statsModal', true)"
                    class="p-3 bg-white text-slate-700 rounded-xl shadow-sm hover:bg-slate-50 border border-slate-200 transition"
                    title="職業統計">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="20" x2="18" y2="10" />
                        <line x1="12" y1="20" x2="12" y2="4" />
                        <line x1="6" y1="20" x2="6" y2="14" />
                    </svg>
                </button>
            </div>
        </header>

        <div class="space-y-8">
            <!-- 待分配區 -->
            <section class="glass-card rounded-2xl overflow-hidden border-0">
                <div class="px-6 py-4 bg-slate-800 flex justify-between items-center cursor-pointer"
                    onclick="toggleUnassigned()">
                    <div class="flex items-center gap-3">
                        <span class="text-xl">🎒</span>
                        <h2 class="text-white font-bold tracking-wide">待分配成員列表</h2>
                    </div>
                    <div class="flex items-center gap-3">
                        <span id="unassigned_count"
                            class="bg-blue-500 text-white text-[10px] font-black px-2 py-0.5 rounded">0</span>
                        <span id="collapse_icon" class="text-white/40 text-xs transition-transform">▼</span>
                    </div>
                </div>
                <div id="unassigned_content" class="p-6">
                    <div id="unassigned_list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4"></div>
                </div>
            </section>

            <!-- 小組區 -->
            <section class="space-y-6">
                <div class="flex items-center justify-between border-b border-slate-200 pb-2">
                    <h3 class="text-xl font-black text-slate-700 flex items-center gap-2">
                        <span class="w-2 h-6 bg-blue-500 rounded-full"></span> 戰略分組
                        <span class="text-xs font-normal text-slate-400 ml-2">已分配人數: <span
                                id="assigned_member_count">0</span></span>
                    </h3>
                    <div class="flex gap-2">
                        <button onclick="addGroup()"
                            class="text-sm font-bold text-blue-600 hover:text-blue-800 transition px-3 py-1">+
                            建立小組</button>
                        <button onclick="exportCSV()"
                            class="text-sm font-bold text-slate-500 hover:text-slate-800 transition px-3 py-1">匯出
                            CSV</button>
                    </div>
                </div>
                <div id="groups_container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            </section>
        </div>
    </div>

    <!-- Modals -->
    <div id="addMemberModal"
        class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl p-8">
            <h2 class="text-xl font-black mb-6 text-slate-800 flex items-center gap-2">📝 招募新成員</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1 ml-1">角色暱稱</label>
                    <input type="text" id="member_name"
                        class="w-full px-4 py-3 bg-slate-50 rounded-xl border border-slate-100 focus:ring-2 focus:ring-blue-500 outline-none transition"
                        placeholder="輸入玩家名字">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-1 ml-1">選擇職業</label>
                    <select id="member_job"
                        class="w-full px-4 py-3 bg-slate-50 rounded-xl border border-slate-100 focus:ring-2 focus:ring-blue-500 outline-none transition">
                        <option value="牧師">✨ 牧師 (Acolyte)</option>
                        <option value="獵人">🏹 獵人 (Archer)</option>
                        <option value="鐵匠">🔨 鐵匠 (Merchant)</option>
                        <option value="巫師">🔮 巫師 (Mage)</option>
                        <option value="刺客">🗡️ 刺客 (Thief)</option>
                        <option value="騎士">🛡️ 騎士 (Swordsman)</option>
                        <option value="槍手">🔫 槍手 (Gunslinger)</option>
                    </select>
                </div>
                <div class="flex gap-3 pt-4">
                    <button onclick="toggleModal('addMemberModal', false)"
                        class="flex-1 py-3 bg-slate-100 rounded-xl font-bold text-slate-500">取消</button>
                    <button onclick="addMember()"
                        class="flex-1 py-3 bg-blue-600 text-white rounded-xl font-bold shadow-lg shadow-blue-100">確認加入</button>
                </div>
            </div>
        </div>
    </div>

    <div id="statsModal"
        class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl p-8">
            <h2 class="text-xl font-black mb-6 text-slate-800">📊 公會職業分佈</h2>
            <div id="stats_container" class="space-y-4"></div>
            <button onclick="toggleModal('statsModal', false)"
                class="w-full mt-8 py-3 bg-slate-900 text-white rounded-xl font-bold">關閉</button>
        </div>
    </div>

    <div id="allMembersModal"
        class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm">
        <div class="bg-white w-full max-w-2xl rounded-2xl shadow-2xl p-8 max-h-[80vh] flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-black text-slate-800">公會冒險者名錄 (<span id="modal_total_count">0</span>)</h2>
            </div>
            <div class="overflow-y-auto flex-grow rounded-xl border border-slate-100">
                <table class="w-full text-left text-sm border-collapse" id="members_table">
                    <thead class="bg-slate-50 sticky top-0 z-10">
                        <tr>
                            <th class="py-3 px-4 font-bold text-slate-400 sortable" onclick="sortTable('name')">成員</th>
                            <th class="py-3 px-4 font-bold text-slate-400 sortable" onclick="sortTable('job')">職業</th>
                            <th class="py-3 px-4 font-bold text-slate-400 sortable" onclick="sortTable('groupId')">組別
                            </th>
                        </tr>
                    </thead>
                    <tbody id="all_members_table_body" class="divide-y divide-slate-50"></tbody>
                </table>
            </div>
            <button onclick="toggleModal('allMembersModal', false)"
                class="mt-6 py-3 bg-slate-100 text-slate-500 rounded-xl font-bold">返回</button>
        </div>
    </div>

    <div id="toast"
        class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-6 py-3 rounded-2xl shadow-2xl opacity-0 transition-all duration-300 pointer-events-none z-[120] text-sm font-bold">
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInAnonymously, onAuthStateChanged, signOut, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, addDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            "apiKey": "AIzaSyBwOa814rtGLjhtt4gum_vwWlYzQDTXehU",
            "authDomain": "loseweight-4b745.firebaseapp.com",
            "projectId": "loseweight-4b745",
            "storageBucket": "loseweight-4b745.firebasestorage.app",
            "messagingSenderId": "76431868318",
            "appId": "1:76431868318:web:d5fdb15284f2823cf8d68f",
            "measurementId": "G-LVBCZP0LK2"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'ro-guild-v4';

        let members = [];
        let groups = [];
        let user = null;
        let unsubscribes = [];
        let sortConfig = { key: 'name', direction: 'asc' };

        const jobsConfig = {
            "牧師": { icon: "✨", border: "border-牧師", color: "#0ea5e9" },
            "獵人": { icon: "🏹", border: "border-獵人", color: "#22c55e" },
            "鐵匠": { icon: "🔨", border: "border-鐵匠", color: "#eab308" },
            "巫師": { icon: "🔮", border: "border-巫師", color: "#a855f7" },
            "刺客": { icon: "🗡️", border: "border-刺客", color: "#64748b" },
            "騎士": { icon: "🛡️", border: "border-騎士", color: "#ef4444" },
            "槍手": { icon: "🔫", border: "border-槍手", color: "#f97316" }
        };

        onAuthStateChanged(auth, async (u) => {
            user = u;
            unsubscribes.forEach(un => un());
            unsubscribes = [];

            if (user) {
                document.getElementById('auth_screen').classList.add('hidden');
                document.getElementById('main_app').classList.remove('hidden');
                const typeTag = document.getElementById('login_type_tag');
                typeTag.innerText = user.isAnonymous ? "遊客模式" : "正式版本";
                typeTag.className = user.isAnonymous ? "text-[10px] bg-slate-200 px-2 py-0.5 rounded font-black text-slate-500" : "text-[10px] bg-blue-100 px-2 py-0.5 rounded font-black text-blue-600";
                document.getElementById('user_display_info').innerText = user.email || "本地儲存中";
                startDataListeners();
            } else {
                document.getElementById('auth_screen').classList.remove('hidden');
                document.getElementById('main_app').classList.add('hidden');
                document.getElementById('app_loading').classList.add('hidden');
            }
        });

        function startDataListeners() {
            if (!user) return;
            const loading = document.getElementById('app_loading');

            // 成員監聽
            unsubscribes.push(onSnapshot(userPath('members'), (s) => {
                members = s.docs.map(d => ({ id: d.id, ...d.data() }));
                renderUI();
                loading.classList.add('hidden');
            }, (err) => console.error(err)));

            // 小組監聽
            unsubscribes.push(onSnapshot(userPath('groups'), (s) => {
                groups = s.docs.map(d => ({ id: d.id, ...d.data() }));
                renderUI();
            }, (err) => console.error(err)));

            // 標題監聽
            unsubscribes.push(onSnapshot(userConfigRef(), (s) => {
                if (s.exists()) document.getElementById('app_title').value = s.data().title || "RO 公會成員分組";
            }));
        }

        const userPath = (coll) => collection(db, 'artifacts', appId, 'users', user.uid, coll);
        const userConfigRef = () => doc(db, 'artifacts', appId, 'users', user.uid, 'settings', 'config');

        // --- OPERATIONS ---
        window.addMember = async () => {
            if (!user) return;
            const name = document.getElementById('member_name').value.trim();
            const job = document.getElementById('member_job').value;
            if (!name) return showToast("請輸入成員暱稱");
            await addDoc(userPath('members'), { name, job, groupId: null, createdAt: Date.now() });
            document.getElementById('member_name').value = '';
            toggleModal('addMemberModal', false);
        };

        window.addGroup = async () => {
            if (!user) return;
            const nextId = groups.length > 0 ? Math.max(...groups.map(g => parseInt(g.id))) + 1 : 1;
            await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'groups', nextId.toString()), {
                id: nextId, name: `第 ${nextId} 小組`, limit: 5, createdAt: Date.now()
            });
        };

        window.assignToGroup = async (mId, gId) => {
            if (!user) return;
            if (gId !== null) {
                const group = groups.find(g => g.id == gId);
                const limit = group?.limit || 5;
                if (members.filter(m => m.groupId == gId).length >= limit) return showToast(`該小組已滿 ${limit} 人`);
            }
            await updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'members', mId), { groupId: gId });
        };

        window.updateGroupLimit = async (gId, limit) => {
            if (!user) return;
            const val = parseInt(limit);
            if (isNaN(val) || val < 1) return;
            await updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'groups', gId.toString()), { limit: val });
        };

        window.renameGroup = async (gId, name) => {
            if (!user) return;
            await updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'groups', gId.toString()), { name });
        };

        window.deleteMember = async (mId) => {
            if (!user) return;
            if (confirm("確定移除該成員？")) await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'members', mId));
        };

        // --- UI ---
        window.showToast = (msg) => {
            const t = document.getElementById('toast');
            t.innerText = msg; t.classList.replace('opacity-0', 'opacity-100');
            setTimeout(() => t.classList.replace('opacity-100', 'opacity-0'), 2500);
        };

        window.toggleModal = (id, show) => {
            document.getElementById(id).classList.toggle('hidden', !show);
            if (show && id === 'statsModal') updateStats();
            if (show && id === 'allMembersModal') renderAllTable();
        };

        function renderUI() {
            // 更新頂部總人數
            document.getElementById('total_member_count').innerText = members.length;
            // 更新彈窗內的總人數 (修正處)
            const modalCount = document.getElementById('modal_total_count');
            if (modalCount) modalCount.innerText = members.length;

            const unList = document.getElementById('unassigned_list');
            const unassigned = members.filter(m => m.groupId === null);
            document.getElementById('unassigned_count').innerText = unassigned.length;
            document.getElementById('assigned_member_count').innerText = members.filter(m => m.groupId !== null).length;

            unList.innerHTML = unassigned.map(m => {
                const cfg = jobsConfig[m.job];
                return `<div class="member-item bg-white p-4 rounded-xl shadow-sm flex flex-col gap-3 ${cfg.border}">
                    <div class="flex items-center gap-2">
                        <span class="text-xl">${cfg.icon}</span>
                        <div class="text-sm font-bold text-slate-800 truncate">${m.name}</div>
                    </div>
                    <div class="flex gap-2">
                        <select onchange="assignToGroup('${m.id}', this.value ? parseInt(this.value) : null)" class="flex-1 text-[10px] bg-slate-50 border-0 rounded-lg p-2 font-bold focus:ring-1 focus:ring-blue-400">
                            <option value="">分配至...</option>
                            ${groups.map(g => `<option value="${g.id}">${g.name}</option>`).join('')}
                        </select>
                        <button onclick="deleteMember('${m.id}')" class="text-slate-300 hover:text-red-500 transition px-1">🗑️</button>
                    </div>
                </div>`;
            }).join('') || '<div class="col-span-full text-center text-slate-400 py-10 font-medium">尚無待分配成員</div>';

            const gCont = document.getElementById('groups_container');
            gCont.innerHTML = groups.sort((a, b) => a.id - b.id).map(g => {
                const gm = members.filter(m => m.groupId == g.id);
                const limit = g.limit || 5;
                const isFull = gm.length >= limit;

                const ratio = gm.length / limit;
                const countColor = isFull ? 'text-red-500' : (ratio > 0.8 ? 'text-orange-500' : 'text-blue-600');

                return `<div class="group-card glass-card p-5 rounded-2xl flex flex-col h-full border-t-4 ${isFull ? 'border-t-red-400' : 'border-t-blue-500'}">
                    <div class="flex justify-between items-center mb-6">
                        <input value="${g.name}" onblur="renameGroup(${g.id}, this.value)" class="font-black text-slate-800 outline-none bg-transparent w-1/2 border-b border-transparent hover:border-slate-200 focus:border-blue-400 transition-all">
                        
                        <div class="flex items-center gap-1.5 bg-slate-100/50 px-3 py-1.5 rounded-xl border border-slate-200/50 shadow-inner">
                            <span class="text-base font-black ${countColor} drop-shadow-sm">${gm.length}</span>
                            <span class="text-slate-300 font-bold">/</span>
                            <input type="number" value="${limit}" min="1" onchange="updateGroupLimit(${g.id}, this.value)" 
                                   class="limit-input w-8 text-base font-black text-slate-500 bg-transparent focus:outline-none text-center rounded-md transition-colors">
                        </div>
                    </div>
                    <div class="space-y-2 flex-grow">
                        ${gm.map(m => `<div onclick="assignToGroup('${m.id}', null)" class="p-3 bg-white/70 rounded-xl text-xs flex justify-between items-center group cursor-pointer hover:bg-red-50 border border-transparent hover:border-red-100 transition-all">
                            <span class="font-bold text-slate-700">${jobsConfig[m.job].icon} ${m.name}</span>
                            <span class="text-[8px] bg-red-100 text-red-500 px-1.5 py-0.5 rounded opacity-0 group-hover:opacity-100 transition-opacity">移出</span>
                        </div>`).join('') || '<div class="text-center text-[10px] text-slate-300 py-10 border-2 border-dashed border-slate-100 rounded-xl">暫無成員</div>'}
                    </div>
                </div>`;
            }).join('');
        }

        window.sortTable = (key) => {
            sortConfig.direction = (sortConfig.key === key && sortConfig.direction === 'asc') ? 'desc' : 'asc';
            sortConfig.key = key;
            renderAllTable();
        };

        function renderAllTable() {
            const body = document.getElementById('all_members_table_body');
            if (!body) return;
            const sorted = [...members].sort((a, b) => {
                let vA = a[sortConfig.key], vB = b[sortConfig.key];
                if (sortConfig.key === 'groupId') { vA = vA ?? 999; vB = vB ?? 999; }
                return sortConfig.direction === 'asc' ? (vA > vB ? 1 : -1) : (vA < vB ? 1 : -1);
            });

            body.innerHTML = sorted.map(m => `<tr>
                <td class="py-3 px-4 font-bold text-slate-700">${m.name}</td>
                <td class="px-4 text-slate-500">${m.job}</td>
                <td class="px-4"><span class="text-[10px] font-bold ${m.groupId ? 'text-blue-600' : 'text-slate-400'}">${m.groupId ? '第 ' + m.groupId + ' 小組' : '未分配'}</span></td>
            </tr>`).join('');
        }

        function updateStats() {
            const cont = document.getElementById('stats_container');
            if (!cont) return;
            cont.innerHTML = Object.keys(jobsConfig).map(job => {
                const count = members.filter(m => m.job === job).length;
                const perc = members.length ? (count / members.length * 100).toFixed(1) : 0;
                return `<div class="bg-slate-50 p-3 rounded-xl">
                    <div class="flex justify-between text-sm mb-1 font-bold"><span>${job}</span><span>${count}</span></div>
                    <div class="w-full bg-white h-1.5 rounded-full overflow-hidden"><div style="width:${perc}%; background:${jobsConfig[job].color}" class="h-full transition-all duration-700"></div></div>
                </div>`;
            }).join('');
        }

        document.getElementById('app_title').onblur = () => {
            if (user) setDoc(userConfigRef(), { title: document.getElementById('app_title').value }, { merge: true });
        };

        window.toggleUnassigned = () => {
            const content = document.getElementById('unassigned_content');
            content.classList.toggle('hidden');
            document.getElementById('collapse_icon').style.transform = content.classList.contains('hidden') ? 'rotate(-90deg)' : 'rotate(0deg)';
        };

        window.exportCSV = () => {
            const csv = "小組,成員,職業\n" + members.filter(m => m.groupId).map(m => {
                const g = groups.find(g => g.id == m.groupId);
                return `${g?.name || '未知'},${m.name},${m.job}`;
            }).join('\n');
            const blob = new Blob(["\uFEFF" + csv], { type: 'text/csv' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `RO分組_${new Date().toLocaleDateString()}.csv`;
            link.click();
        };

        // AUTH Actions
        let authMode = 'login';
        document.getElementById('auth_switch_btn').onclick = () => {
            authMode = authMode === 'login' ? 'register' : 'login';
            document.getElementById('auth_submit_btn').innerText = authMode === 'login' ? '登入系統' : '立即註冊';
            document.getElementById('auth_switch_btn').innerText = authMode === 'login' ? '還沒有帳號？點此註冊' : '已有帳號？返回登入';
        };
        document.getElementById('auth_submit_btn').onclick = async () => {
            const email = document.getElementById('auth_email').value;
            const pass = document.getElementById('auth_password').value;
            try {
                if (authMode === 'login') await signInWithEmailAndPassword(auth, email, pass);
                else await createUserWithEmailAndPassword(auth, email, pass);
            } catch (e) { showToast(e.message); }
        };
        document.getElementById('guest_login_btn').onclick = () => signInAnonymously(auth);
        window.handleLogout = () => signOut(auth);
    </script>
</body>

</html>
