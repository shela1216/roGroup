<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RO 公會管理系統 - 穩定版</title>

    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cellipse cx='50' cy='60' rx='40' ry='35' fill='%23ff99aa'/%3E%3Cellipse cx='50' cy='58' rx='38' ry='32' fill='%23ffb3bf'/%3E%3Cpath d='M35 55 Q 35 45 40 45 T 45 55' fill='none' stroke='%23333' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M55 55 Q 55 45 60 45 T 65 55' fill='none' stroke='%23333' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: #f8fafc;
            color: #1e293b;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .loading-overlay {
            position: fixed;
            inset: 0;
            background: #ffffff;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s;
        }

        .btn-primary {
            @apply bg-blue-600 text-white hover:bg-blue-700 transition-all shadow-md active:scale-95 disabled:opacity-50;
        }

        .room-tag {
            font-family: monospace;
            letter-spacing: 1px;
        }
    </style>
</head>

<body class="p-4 md:p-8">
    <div id="app_loading" class="loading-overlay">
        <div class="animate-spin rounded-full h-12 w-12 border-4 border-blue-100 border-t-blue-600 mb-4"></div>
        <p id="loading_text" class="text-blue-900 font-bold">正在連線至伺服器...</p>
    </div>

    <!-- 登入介面 -->
    <div id="auth_screen"
        class="hidden fixed inset-0 z-[100] bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md p-8 rounded-3xl shadow-2xl">
            <div class="text-center mb-8">
                <div class="text-5xl mb-4">🐷</div>
                <h1 class="text-2xl font-black text-slate-800">冒險者登入</h1>
                <p class="text-slate-400 mt-2 text-sm">登入後即可建立專屬的分組看板</p>
            </div>
            <div class="space-y-4">
                <input type="email" id="auth_email" placeholder="電子郵件"
                    class="w-full px-4 py-3 bg-slate-50 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500 transition">
                <input type="password" id="auth_password" placeholder="密碼"
                    class="w-full px-4 py-3 bg-slate-50 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500 transition">
                <button id="auth_btn"
                    class="w-full py-4 bg-blue-600 text-white rounded-xl font-bold hover:bg-blue-700 shadow-lg transition">登入
                    / 註冊帳號</button>

                <div class="flex items-center gap-4 py-2">
                    <div class="flex-1 h-[1px] bg-slate-100"></div>
                    <span class="text-slate-300 text-xs">快速通道</span>
                    <div class="flex-1 h-[1px] bg-slate-100"></div>
                </div>

                <button id="test_acc_btn"
                    class="w-full py-3 border-2 border-blue-100 text-blue-600 rounded-xl font-bold hover:bg-blue-50 transition">
                    🚀 使用測試帳號快速登入
                </button>

                <button id="guest_btn" class="w-full text-slate-400 text-sm hover:underline">匿名進入 (僅限協作查看)</button>
            </div>
        </div>
    </div>

    <!-- 大廳介面 -->
    <div id="lobby_screen"
        class="hidden fixed inset-0 z-[90] bg-slate-50 flex items-center justify-center p-4 overflow-y-auto">
        <div class="max-w-2xl w-full my-auto">
            <div class="flex justify-between items-center mb-8">
                <div>
                    <h2 class="text-3xl font-black text-slate-800">公會大廳</h2>
                    <p id="user_display" class="text-slate-400 text-sm">歡迎回來，冒險者</p>
                </div>
                <button onclick="handleLogout()"
                    class="px-4 py-2 bg-white text-red-400 rounded-xl text-sm font-bold shadow-sm border border-red-50 hover:bg-red-50">登出</button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
                <button id="btn_create_board" onclick="createNewBoard()"
                    class="p-8 bg-blue-600 text-white rounded-3xl shadow-xl hover:bg-blue-700 transition flex flex-col items-center gap-3 active:scale-95 disabled:opacity-50">
                    <span class="text-4xl">➕</span>
                    <span class="font-black text-lg">建立新分組看板</span>
                </button>
                <div
                    class="p-8 bg-white border-2 border-dashed border-slate-200 rounded-3xl flex flex-col items-center gap-3">
                    <span class="text-4xl">🔑</span>
                    <div class="flex w-full gap-2">
                        <input type="text" id="join_code_input" placeholder="輸入協作代碼"
                            class="flex-1 text-center bg-slate-100 border-0 rounded-xl text-sm uppercase font-bold p-2">
                        <button onclick="joinBoardByCode()"
                            class="px-6 py-2 bg-slate-800 text-white rounded-xl text-sm font-bold">加入</button>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100">
                <h3 class="text-xs font-black text-slate-400 mb-6 uppercase tracking-[0.2em]">我的看板紀錄</h3>
                <div id="my_boards_list" class="space-y-3">
                    <div class="text-center py-10">
                        <p class="text-slate-300 text-sm">尚未建立任何看板</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 看板主程式 -->
    <div id="main_app" class="max-w-6xl mx-auto hidden pb-20">
        <header class="mb-10 flex flex-col md:flex-row justify-between items-start md:items-end gap-6">
            <div class="w-full md:w-auto">
                <div class="flex flex-wrap items-center gap-2 mb-3">
                    <button onclick="returnToLobby()"
                        class="bg-slate-800 text-white px-3 py-1 rounded-lg text-xs font-bold hover:bg-black transition">←
                        返回大廳</button>
                    <div
                        class="bg-blue-100 text-blue-600 px-3 py-1 rounded-lg text-xs font-black flex items-center gap-2">
                        代碼: <span id="display_room_id" class="room-tag">---</span>
                        <button onclick="copyRoomCode()" class="text-blue-400 hover:text-blue-700">📋</button>
                    </div>
                </div>
                <input type="text" id="app_title"
                    class="text-4xl font-black text-slate-800 bg-transparent border-b-2 border-transparent focus:border-blue-500 outline-none w-full transition-all">
            </div>
            <div class="flex gap-3 w-full md:w-auto">
                <button onclick="toggleModal('addMemberModal', true)"
                    class="flex-1 md:flex-none bg-blue-600 text-white px-8 py-3 rounded-2xl font-black shadow-lg hover:bg-blue-700">新增成員</button>
                <button onclick="toggleModal('statsModal', true)"
                    class="p-3 bg-white border rounded-2xl shadow-sm">📊</button>
            </div>
        </header>

        <div class="space-y-8">
            <section class="glass-card rounded-3xl overflow-hidden shadow-sm border border-slate-200">
                <div class="px-6 py-4 bg-slate-800 flex justify-between items-center cursor-pointer"
                    onclick="toggleUnassigned()">
                    <h2 class="text-white font-black">🎒 待分配成員 (<span id="unassigned_count">0</span>)</h2>
                    <span id="collapse_icon" class="text-white/40 text-xs">▼</span>
                </div>
                <div id="unassigned_content" class="p-6">
                    <div id="unassigned_list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4"></div>
                </div>
            </section>
            <div id="groups_container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
            <button onclick="addGroup()"
                class="w-full py-4 border-2 border-dashed border-slate-300 text-slate-400 rounded-3xl font-bold hover:bg-slate-50 transition">+
                建立新小組</button>
        </div>
    </div>

    <!-- Modals -->
    <div id="addMemberModal"
        class="hidden fixed inset-0 z-[110] flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm">
        <div class="bg-white w-full max-w-md rounded-3xl p-8">
            <h2 class="text-xl font-black mb-6">✨ 招募新成員</h2>
            <div class="space-y-4">
                <input type="text" id="member_name" class="w-full px-4 py-3 bg-slate-50 border rounded-xl outline-none"
                    placeholder="輸入角色名稱">
                <select id="member_job" class="w-full px-4 py-3 bg-slate-50 border rounded-xl outline-none">
                    <option value="牧師">✨ 牧師 (Priest)</option>
                    <option value="獵人">🏹 獵人 (Hunter)</option>
                    <option value="巫師">🔮 巫師 (Wizard)</option>
                    <option value="刺客">🗡️ 刺客 (Assassin)</option>
                    <option value="騎士">🛡️ 騎士 (Knight)</option>
                </select>
                <div class="flex gap-3 pt-4">
                    <button onclick="toggleModal('addMemberModal', false)"
                        class="flex-1 py-3 bg-slate-100 rounded-xl font-bold">取消</button>
                    <button onclick="addMember()"
                        class="flex-1 py-3 bg-blue-600 text-white rounded-xl font-bold">確認</button>
                </div>
            </div>
        </div>
    </div>

    <div id="statsModal"
        class="hidden fixed inset-0 z-[110] flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm">
        <div class="bg-white w-full max-w-md rounded-3xl p-8">
            <h2 class="text-xl font-black mb-8">📊 職業分布統計</h2>
            <div id="stats_container" class="space-y-6"></div>
            <button onclick="toggleModal('statsModal', false)"
                class="w-full mt-10 py-4 bg-slate-900 text-white rounded-2xl font-bold">關閉</button>
        </div>
    </div>

    <div id="toast"
        class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-8 py-3 rounded-2xl opacity-0 transition-all z-[120] text-sm font-bold pointer-events-none">
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, addDoc, updateDoc, deleteDoc, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            "apiKey": "AIzaSyBwOa814rtGLjhtt4gum_vwWlYzQDTXehU",
            "authDomain": "loseweight-4b745.firebaseapp.com",
            "projectId": "loseweight-4b745",
            "storageBucket": "loseweight-4b745.firebasestorage.app",
            "messagingSenderId": "76431868318",
            "appId": "1:76431868318:web:d5fdb15284f2823cf8d68f",
            "measurementId": "G-LVBCZP0LK2"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'ro-guild-v2';

        let user = null;
        let activeRoom = null;
        let members = [];
        let groups = [];
        let unsubscribes = [];

        const jobsConfig = {
            "牧師": { icon: "✨", color: "#0ea5e9", border: "border-l-blue-500", bg: "bg-blue-50" },
            "獵人": { icon: "🏹", color: "#22c55e", border: "border-l-green-500", bg: "bg-green-50" },
            "巫師": { icon: "🔮", color: "#a855f7", border: "border-l-purple-500", bg: "bg-purple-50" },
            "刺客": { icon: "🗡️", color: "#64748b", border: "border-l-slate-500", bg: "bg-slate-50" },
            "騎士": { icon: "🛡️", color: "#ef4444", border: "border-l-red-500", bg: "bg-red-50" }
        };

        // --- Firebase 操作輔助 (Exponential Backoff) ---
        async function withRetry(fn, maxRetries = 5) {
            let delay = 1000;
            for (let i = 0; i < maxRetries; i++) {
                try { return await fn(); } catch (err) {
                    if (i === maxRetries - 1) throw err;
                    await new Promise(r => setTimeout(r, delay));
                    delay *= 2;
                }
            }
        }

        // --- Auth 邏輯 ---
        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (e) { console.error("Token Auth Failed", e); }
        };

        onAuthStateChanged(auth, (u) => {
            user = u;
            document.getElementById('app_loading').classList.add('hidden');
            if (u) {
                document.getElementById('auth_screen').classList.add('hidden');
                document.getElementById('lobby_screen').classList.remove('hidden');
                document.getElementById('user_display').innerText = u.isAnonymous ? "訪客 (僅能觀看與協作)" : u.email;
                loadMyBoards();
            } else {
                document.getElementById('auth_screen').classList.remove('hidden');
                document.getElementById('lobby_screen').classList.add('hidden');
                document.getElementById('main_app').classList.add('hidden');
            }
        });

        initAuth();

        // 快速登入測試帳號
        document.getElementById('test_acc_btn').onclick = async () => {
            document.getElementById('loading_text').innerText = "登入測試帳號中...";
            document.getElementById('app_loading').classList.remove('hidden');
            try {
                await signInWithEmailAndPassword(auth, "tester@ro-guild.com", "ro123456");
            } catch (e) {
                try {
                    await createUserWithEmailAndPassword(auth, "tester@ro-guild.com", "ro123456");
                } catch (e2) { showToast("登入失敗，請確認網路連線"); }
            } finally {
                document.getElementById('app_loading').classList.add('hidden');
            }
        };

        document.getElementById('auth_btn').onclick = async () => {
            const email = document.getElementById('auth_email').value.trim();
            const pass = document.getElementById('auth_password').value;
            if (!email || !pass) return showToast("請填寫帳號密碼");
            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (e) {
                try { await createUserWithEmailAndPassword(auth, email, pass); } catch (e2) { showToast("密碼錯誤或信箱無效"); }
            }
        };

        document.getElementById('guest_btn').onclick = () => signInAnonymously(auth);
        window.handleLogout = () => signOut(auth);

        // --- 大廳邏輯 ---
        window.createNewBoard = async () => {
            if (!user) return showToast("尚未登入");
            if (user.isAnonymous) return showToast("訪客帳號無法建立看板，請使用測試帳號登入");

            const btn = document.getElementById('btn_create_board');
            btn.disabled = true;
            document.getElementById('loading_text').innerText = "正在建立看板資料空間...";
            document.getElementById('app_loading').classList.remove('hidden');

            const roomId = 'RO-' + Math.random().toString(36).substr(2, 6).toUpperCase();

            try {
                // RULE 1: 修正路徑段數為偶數 (4 段)
                // 修正後路徑: artifacts / {appId} / public / {roomId}
                const publicRef = doc(db, 'artifacts', appId, 'public', roomId);
                const userRef = doc(db, 'artifacts', appId, 'users', user.uid, 'boards', roomId);

                await withRetry(() => setDoc(publicRef, {
                    title: "未命名分組看板",
                    owner: user.uid,
                    createdAt: Date.now()
                }));

                await withRetry(() => setDoc(userRef, {
                    roomId,
                    title: "未命名分組看板",
                    createdAt: Date.now()
                }));

                openBoard(roomId);
            } catch (err) {
                console.error(err);
                showToast("建立失敗：路徑權限或格式錯誤");
            } finally {
                btn.disabled = false;
                document.getElementById('app_loading').classList.add('hidden');
            }
        };

        function loadMyBoards() {
            if (!user || user.isAnonymous) return;
            const q = collection(db, 'artifacts', appId, 'users', user.uid, 'boards');
            onSnapshot(q, (s) => {
                const list = document.getElementById('my_boards_list');
                const boards = s.docs.map(d => d.data());
                if (boards.length === 0) {
                    list.innerHTML = '<p class="text-center text-slate-300 py-6 text-sm">點擊按鈕建立第一個看板</p>';
                    return;
                }
                list.innerHTML = boards.sort((a, b) => b.createdAt - a.createdAt).map(b => `
                    <div onclick="openBoard('${b.roomId}')" class="p-4 bg-white border border-slate-100 rounded-2xl cursor-pointer hover:border-blue-500 transition-all flex justify-between items-center group">
                        <div class="flex items-center gap-4">
                            <div class="w-10 h-10 bg-slate-50 rounded-lg flex items-center justify-center group-hover:bg-blue-50">📋</div>
                            <div>
                                <p class="font-bold text-slate-700">${b.title}</p>
                                <p class="text-[10px] text-slate-400 font-mono">${b.roomId}</p>
                            </div>
                        </div>
                        <span class="text-slate-300">→</span>
                    </div>
                `).join('');
            }, (err) => console.error("Snapshot error:", err));
        }

        // --- 看板內容邏輯 ---
        window.openBoard = async (roomId) => {
            // 修正後路徑段數: 4 段
            const snap = await getDoc(doc(db, 'artifacts', appId, 'public', roomId));
            if (!snap.exists()) return showToast("找不到此看板");

            activeRoom = roomId;
            document.getElementById('lobby_screen').classList.add('hidden');
            document.getElementById('main_app').classList.remove('hidden');
            document.getElementById('display_room_id').innerText = roomId;

            unsubscribes.forEach(u => u());
            unsubscribes = [];

            // 監聽看板基本資訊 (4 段)
            unsubscribes.push(onSnapshot(doc(db, 'artifacts', appId, 'public', roomId), (s) => {
                if (s.exists()) document.getElementById('app_title').value = s.data().title;
            }, (e) => console.error(e)));

            // 監聽成員 (6 段: artifacts / {appId} / public / {roomId} / members / {memberId})
            unsubscribes.push(onSnapshot(collection(db, 'artifacts', appId, 'public', roomId, 'members'), (s) => {
                members = s.docs.map(d => ({ id: d.id, ...d.data() }));
                renderUI();
            }, (e) => console.error(e)));

            // 監聽群組 (6 段)
            unsubscribes.push(onSnapshot(collection(db, 'artifacts', appId, 'public', roomId, 'groups'), (s) => {
                groups = s.docs.map(d => ({ id: d.id, ...d.data() }));
                renderUI();
            }, (e) => console.error(e)));
        };

        window.returnToLobby = () => {
            activeRoom = null;
            document.getElementById('main_app').classList.add('hidden');
            document.getElementById('lobby_screen').classList.remove('hidden');
            unsubscribes.forEach(u => u());
        };

        window.addMember = async () => {
            if (!user || !activeRoom) return;
            const name = document.getElementById('member_name').value.trim();
            const job = document.getElementById('member_job').value;
            if (!name) return showToast("請輸入名稱");

            await addDoc(collection(db, 'artifacts', appId, 'public', activeRoom, 'members'), {
                name, job, groupId: null, createdAt: Date.now()
            });
            document.getElementById('member_name').value = '';
            toggleModal('addMemberModal', false);
        };

        window.addGroup = async () => {
            if (!user || !activeRoom) return;
            const nextId = groups.length > 0 ? Math.max(...groups.map(g => parseInt(g.id))) + 1 : 1;
            await setDoc(doc(db, 'artifacts', appId, 'public', activeRoom, 'groups', nextId.toString()), {
                id: nextId, name: `第 ${nextId} 小組`, limit: 5
            });
        };

        window.assignToGroup = async (mId, gId) => {
            if (!user || !activeRoom) return;
            await updateDoc(doc(db, 'artifacts', appId, 'public', activeRoom, 'members', mId), { groupId: gId });
        };

        function renderUI() {
            const unassigned = members.filter(m => m.groupId === null);
            document.getElementById('unassigned_count').innerText = unassigned.length;

            const unList = document.getElementById('unassigned_list');
            unList.innerHTML = unassigned.map(m => `
                <div class="bg-white p-4 rounded-2xl shadow-sm border-l-4 ${jobsConfig[m.job].border}">
                    <div class="font-bold text-slate-700 mb-3">${jobsConfig[m.job].icon} ${m.name}</div>
                    <select onchange="assignToGroup('${m.id}', this.value ? parseInt(this.value) : null)" class="w-full text-xs bg-slate-50 border-0 rounded-lg p-2 font-bold">
                        <option value="">選擇分組...</option>
                        ${groups.map(g => `<option value="${g.id}">${g.name}</option>`).join('')}
                    </select>
                </div>
            `).join('') || '<p class="col-span-full text-center text-slate-300 py-4 text-xs italic">所有成員已就位</p>';

            const gCont = document.getElementById('groups_container');
            gCont.innerHTML = groups.sort((a, b) => a.id - b.id).map(g => {
                const gm = members.filter(m => m.groupId == g.id);
                return `
                <div class="glass-card p-6 rounded-3xl flex flex-col border border-slate-100 shadow-sm">
                    <div class="flex justify-between items-center mb-4">
                        <span class="font-black text-slate-800">${g.name}</span>
                        <span class="text-xs bg-slate-100 px-2 py-1 rounded-lg text-slate-500">${gm.length} / ${g.limit}</span>
                    </div>
                    <div class="space-y-2">
                        ${gm.map(m => `
                            <div onclick="assignToGroup('${m.id}', null)" class="p-3 ${jobsConfig[m.job].bg} rounded-xl text-xs font-bold flex justify-between group cursor-pointer">
                                <span>${jobsConfig[m.job].icon} ${m.name}</span>
                                <span class="text-red-300 opacity-0 group-hover:opacity-100">移出</span>
                            </div>
                        `).join('') || '<div class="text-center py-6 text-[10px] text-slate-300 border border-dashed rounded-xl">尚無成員</div>'}
                    </div>
                </div>`;
            }).join('');
        }

        window.toggleModal = (id, show) => {
            document.getElementById(id).classList.toggle('hidden', !show);
            if (show && id === 'statsModal') updateStats();
        };

        function updateStats() {
            const cont = document.getElementById('stats_container');
            cont.innerHTML = Object.keys(jobsConfig).map(job => {
                const count = members.filter(m => m.job === job).length;
                const perc = members.length ? (count / members.length * 100).toFixed(0) : 0;
                return `
                    <div>
                        <div class="flex justify-between text-xs font-bold mb-1">
                            <span>${jobsConfig[job].icon} ${job}</span>
                            <span>${count} 位 (${perc}%)</span>
                        </div>
                        <div class="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden">
                            <div style="width:${perc}%; background:${jobsConfig[job].color}" class="h-full"></div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.showToast = (msg) => {
            const t = document.getElementById('toast');
            t.innerText = msg; t.classList.replace('opacity-0', 'opacity-100');
            setTimeout(() => t.classList.replace('opacity-100', 'opacity-0'), 3000);
        };

        document.getElementById('app_title').onblur = async () => {
            if (!activeRoom || !user || user.isAnonymous) return;
            const title = document.getElementById('app_title').value;
            await updateDoc(doc(db, 'artifacts', appId, 'public', activeRoom), { title });
            await updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'boards', activeRoom), { title });
        };

        window.joinBoardByCode = () => {
            const code = document.getElementById('join_code_input').value.trim().toUpperCase();
            if (!code) return showToast("請輸入代碼");
            openBoard(code);
        };

        window.copyRoomCode = () => {
            const text = document.getElementById('display_room_id').innerText;
            const tempInput = document.createElement("input");
            tempInput.value = text;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);
            showToast("代碼已複製到剪貼簿");
        };
    </script>
</body>

</html>
